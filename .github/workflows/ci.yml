name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (forge test + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge build
        run: forge build --sizes
        working-directory: contracts

      - name: forge test
        run: forge test -vv
        working-directory: contracts

      - name: forge coverage
        run: forge coverage --report summary
        working-directory: contracts

  workspace:
    name: workspace (pnpm install + build + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm -r build
        run: pnpm -r --filter "!@flowpay/contracts" build

      - name: frontend build
        run: pnpm -F @flowpay/frontend build
