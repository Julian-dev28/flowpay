[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200

remappings = [
    "openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
    "permit2/=lib/permit2/src/"
]

[profile.default.fuzz]
max_test_rejects = 150000
runs = 5000

[profile.default.invariant]
runs = 256
depth = 128
