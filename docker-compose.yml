# Local dev stack: redis + the three backend services.
#
# The frontend is not containerized — run it with `pnpm -F @flowpay/frontend dev`
# alongside this stack. Anvil is also not in compose; see `docs/DEMO.md` for the
# end-to-end demo path.
#
# .env files are optional. Every service has Zod defaults so a missing .env
# starts the service in a sensible stub configuration (no on-chain calls).

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - path: services/orchestrator/.env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  tx-submitter:
    build:
      context: .
      dockerfile: services/tx-submitter/Dockerfile
    env_file:
      - path: services/tx-submitter/.env
        required: false
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  indexer:
    build:
      context: .
      dockerfile: services/indexer/Dockerfile
    env_file:
      - path: services/indexer/.env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
