version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - services/orchestrator/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  tx-submitter:
    build:
      context: .
      dockerfile: services/tx-submitter/Dockerfile
    env_file:
      - services/tx-submitter/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  indexer:
    build:
      context: .
      dockerfile: services/indexer/Dockerfile
    env_file:
      - services/indexer/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
